events {}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 5;
  gzip_types text/css text/plain application/javascript application/json image/svg+xml;

  server {
    listen 8080;
    server_name _;
    location = /health { proxy_pass http://backend:5000/health; }
    location / { return 308 https://$host$request_uri; }
  }

  server {
    listen 8443 ssl;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    include /etc/nginx/security-headers.conf;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /health {
      proxy_pass http://backend:5000/health;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /metrics {
      proxy_pass http://backend:5000/metrics;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
      proxy_pass http://backend:5000;
      proxy_http_version 1.1;
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_read_timeout 300s;
      client_max_body_size 60m;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite names build assets by content hash, so they can stay cached safely.
    location /assets/ {
      try_files $uri =404;
      include /etc/nginx/security-headers.conf;
    add_header Strict-Transport-Security "max-age=31536000" always;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
      try_files $uri $uri/ /index.html;
      include /etc/nginx/security-headers.conf;
    add_header Strict-Transport-Security "max-age=31536000" always;
      add_header Cache-Control "no-cache";
    }
  }
}
